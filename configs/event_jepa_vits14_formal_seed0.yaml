data_root: /mnt/data2/gsy/Event-JEPA/datasets/stage2_gep_vits14
output_dir: /mnt/data2/gsy/Event-JEPA/runs/event_jepa_vits14_formal_seed0

seed: 0
timestamp_scale: 1.0e-6

context_frames: 4
horizons:
  - 1
  - 2
  - 4

n_tokens: 256
embed_dim: 384

num_heads: 6
encoder_layers: 12
predictor_layers: 2

max_positions: 4096
max_context_frames: 8

# 4 × A100
# 8/GPU × 4 GPU × grad_accum 2 = effective global batch 64
batch_size: 16
grad_accum_steps: 1
num_workers: 8

learning_rate: 1.0e-4
weight_decay: 1.0e-5
min_learning_rate: 0.0
warmup_steps: 1000
total_steps: 100000

ema_start: 0.996
ema_end: 0.9999

precision: bf16
grad_clip_norm: 1.0

# Event-JEPA V1 fixed
residual_weight: 0.0
order_weight: 0.0
order_margin: 0.005

log_every: 10
validate_every: 1000
save_every: 5000
